<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="NoCode IA Academy — Apprends à créer des sites web professionnels sans coder, grâce aux outils IA les plus puissants."/>
  <title>NoCode IA Academy — Formation LMS</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%235b21b6'/><text y='70' x='50' text-anchor='middle' font-size='56' font-family='sans-serif' fill='white'>⚡</text></svg>"/>
  <link rel="stylesheet" href="design.css"/>
</head>
<body>
<div class="bg-ambient"></div>
<div class="grid-bg"></div>

<!-- ═══ LOGIN ═══════════════════════════════════════════════ -->
<div id="login-page">
  <div class="login-card">
    <div class="login-ico">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M13 10V3L4 14h7v7l9-11h-7z"/>
      </svg>
    </div>
    <h1 class="login-title">NoCode IA Academy</h1>
    <p class="login-sub">Entre ta clé d'accès pour accéder à la formation complète et à tous tes cours.</p>
    <label class="field-lbl" for="key-input">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
      Clé d'accès
    </label>
    <input id="key-input" class="key-input" type="password" placeholder="••••••••••" autocomplete="off"/>
    <p id="login-err" class="login-err"></p>
    <button id="btn-login" class="btn-login">Accéder à ma formation →</button>
    <p class="login-hint"></p>
  </div>
</div>

<!-- ═══ APP ══════════════════════════════════════════════════ -->
<div id="app" style="display:none;min-height:100vh">

  <!-- SIDEBAR OVERLAY (mobile) -->
  <div class="sidebar-overlay"></div>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <!-- Logo -->
    <div class="sb-logo">
      <div class="sb-logo-ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
      </div>
      <div class="sb-logo-txt">
        NoCode IA
        <small>Academy</small>
      </div>
    </div>

    <!-- Progress -->
    <div class="sb-prog">
      <div class="sb-prog-row">
        <span>Progression</span>
        <span id="prog-pct">0%</span>
      </div>
      <div class="prog-track">
        <div class="prog-fill" id="prog-fill" style="width:0%"></div>
      </div>
    </div>

    <!-- Dashboard link -->
    <div style="padding:8px 12px;border-bottom:1px solid var(--b1)">
      <button id="dash-btn" style="display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:9px;font-size:13px;font-weight:600;color:var(--t2);transition:all .15s;background:none;border:none;cursor:pointer" onmouseover="this.style.background='rgba(255,255,255,.04)'" onmouseout="this.style.background='none'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Tableau de bord
      </button>
    </div>

    <!-- Nav -->
    <nav class="sb-nav" id="sb-nav"></nav>

    <!-- Footer -->
    <div class="sb-footer">
      <button id="btn-logout" class="btn-logout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Se déconnecter
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">

    <!-- TOPBAR -->
    <header class="topbar">
      <div class="topbar-bread">
        <span id="topbar-module">—</span>
        <span class="t-sep" id="topbar-sep" style="display:none">›</span>
        <strong id="topbar-lesson"></strong>
      </div>
      <div class="topbar-right">
        <div class="chip chip-streak">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
          NoCode IA
        </div>
        <div class="chip chip-xp">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <span id="xp-count">0 XP</span>
        </div>
      </div>
    </header>

    <!-- CONTENT -->
    <main class="content" id="content">
      <!-- Dynamic content rendered by JS -->
    </main>

  </div><!-- /main -->
</div><!-- /app -->

<!-- MOBILE MENU TOGGLE -->
<button class="menu-toggle" aria-label="Menu">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
</button>

<!-- XP Toast -->
<div class="xp-toast" id="xp-toast">+50 XP ! 🔥</div>

<script src="app.js"></script>
<script src="lessons-additional.js"></script>
<script src="lessons-additional-part2.js"></script>
</body>
</html>
